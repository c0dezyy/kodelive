name: Build plugin
on:
  push:
    paths: ['plugin/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package --file plugin/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: SpectatorCamera-jar
          path: plugin/target/SpectatorCamera-*.jar
